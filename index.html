  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: #08080d;

    font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace;
    min-height: 100vh;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
  }
  body { padding-bottom: env(safe-area-inset-bottom); padding-top: env(safe-area-inset-top); }

  .header {
    padding: 18px 16px 10px;
    border-bottom: 1px solid #151520;
    position: sticky;
    top: 0;
    background: #08080d;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header h1 { font-size: 18px; font-weight: 900; color: #c8a84e; letter-spacing: 0.08em; }
  .header .stats { font-size: 10px; color: #555; margin-top: 3px; }
  .header .add-btn {
    background: #1a1628; color: #c8a84e; border: 1px solid #2a2438;
    width: 36px; height: 36px; border-radius: 8px; font-size: 20px; font-weight: 700;
    cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center;
  }
  .header .add-btn:active { background: #2a2438; }

  .tabs {
    display: flex; overflow-x: auto;
    position: sticky; top: 64px; background: #08080d; z-index: 9;
    border-bottom: 1px solid #151520;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    background: transparent; color: #444; border: none;
    padding: 10px 14px; font-size: 15px; cursor: pointer;
    border-bottom: 2px solid transparent; font-family: inherit;
    transition: all 0.15s; flex-shrink: 0;
  }
  .tab.active { background: #12121a; color: #c8a84e; border-bottom-color: #c8a84e; }

  .content { padding: 14px 16px 100px; }
  .section-label { font-size: 13px; font-weight: 700; color: #c8a84e; margin-bottom: 3px; }
  .section-count { font-size: 10px; color: #444; margin-bottom: 12px; }
  .priority-label {
    font-size: 9px; color: #c8a84e; text-transform: uppercase;
    letter-spacing: 0.12em; margin-bottom: 6px;
  }
  .priority-block { margin-bottom: 14px; }

  .item {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 0; border-bottom: 1px solid #15151f;
    cursor: pointer; transition: background 0.1s;
  }
  .item:active { background: #0e0e16; }
  .item.long-pressing { background: #16162a; }
  .checkbox-wrap {
    padding: 4px 8px 4px 4px;
    margin: -4px -4px -4px -4px;
    flex-shrink: 0;
    cursor: pointer;
  }
  .checkbox-wrap:active { background: #1a1a2a; border-radius: 6px; }
  .checkbox {
    width: 22px; height: 22px; border-radius: 5px; border: 2px solid #2a2a3a;
    background: transparent; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    pointer-events: none;
  }
  .checkbox.done { border-color: #c8a84e; background: #c8a84e; }
  .checkbox.done::after { content: '✓'; color: #08080d; font-size: 13px; font-weight: 900; }
  .item-title { font-size: 13px; color: #d0cdc5; line-height: 1.35; }
  .item.done .item-title { color: #3a3a4a; text-decoration: line-through; }

  .pairing-card {
    background: #0e0e16; border-radius: 8px; padding: 13px;
    margin-bottom: 8px; border: 1px solid #1a1a28;
  }
  .pairing-name { font-size: 14px; font-weight: 700; color: #c8a84e; margin-bottom: 5px; }
  .pairing-desc { font-size: 10px; color: #777; line-height: 1.5; margin-bottom: 7px; }
  .pairing-tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .pairing-tag {
    background: #16162a; color: #999; font-size: 9px;
    padding: 3px 7px; border-radius: 3px;
  }

  .pairings-intro { font-size: 11px; color: #666; margin-bottom: 14px; line-height: 1.6; }

  .footer {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, #08080d 40%);
    padding: 24px 16px 14px; text-align: center;
    font-size: 9px; color: #333; letter-spacing: 0.08em; text-transform: uppercase;
    pointer-events: none;
  }

  /* Modal */
  .modal-backdrop {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7); z-index: 100;
    display: none; align-items: flex-end; justify-content: center;
    backdrop-filter: blur(4px);
  }
  .modal-backdrop.active { display: flex; }
  .modal {
    background: #12121a; border: 1px solid #2a2438; border-bottom: none;
    border-radius: 16px 16px 0 0; padding: 20px 16px 32px;
    width: 100%; max-width: 500px;
    animation: slideUp 0.2s ease-out;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-title { font-size: 13px; color: #c8a84e; margin-bottom: 14px; font-weight: 700; }
  .modal-item-name {
    font-size: 12px; color: #888; margin-bottom: 16px;
    padding: 8px 12px; background: #08080d; border-radius: 6px;
    word-break: break-word;
  }
  .modal-action {
    width: 100%; background: #1a1a28; color: #d0cdc5; border: 1px solid #2a2a3a;

    display: flex; align-items: center; gap: 10px;
  }
  .modal-action:active { background: #2a2a3a; }
  .modal-action.danger { color: #c44; border-color: #441818; }
  .modal-action.danger:active { background: #2a1010; }
  .modal-action-icon { font-size: 16px; width: 22px; text-align: center; }
  .modal-cancel {
    margin-top: 12px; background: transparent; color: #666; border: none;
    width: 100%; padding: 12px; font-size: 12px; cursor: pointer; font-family: inherit;

  /* Add modal */
  .modal-input, .modal-select {
    width: 100%; background: #08080d; color: #d0cdc5;
    border: 1px solid #2a2a3a; border-radius: 6px;
    padding: 12px; font-size: 13px; font-family: inherit;
    margin-bottom: 10px;

  .modal-input:focus, .modal-select:focus { outline: none; border-color: #c8a84e; }
  .modal-submit {
    width: 100%; background: #c8a84e; color: #08080d; border: none;

];

function runMigrations(data) {
  const currentVersion = data.version || 1;
  for (let i = currentVersion; i < MIGRATIONS.length + 1; i++) {
    try {
      data = MIGRATIONS[i - 1](data);
      data.version = i + 1;
    } catch (e) {
      console.error('Migration ' + i + ' failed:', e);
    }
  }
  return data;
}

function loadData() {
  try {
    const stored = localStorage.getItem(STORAGE_KEY);
    if (stored) {
      state.data = JSON.parse(stored);
      // Ensure version exists for old data
      if (!state.data.version) state.data.version = 1;
      // Run any pending migrations (non-destructive)
      const targetVersion = MIGRATIONS.length + 1;
      if (state.data.version < targetVersion) {
        state.data = runMigrations(state.data);
        saveData();
      }
    } else {
      state.data = JSON.parse(JSON.stringify(INITIAL_DATA));
      saveData();
    }
  } catch (e) {
    state.data = JSON.parse(JSON.stringify(INITIAL_DATA));
  }
}

function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state.data)); }
  catch (e) { console.error('Save failed', e); }
}

function findItem(itemId) {
  for (const catKey of Object.keys(state.data.categories)) {
    const item = state.data.categories[catKey].items.find(i => i.id === itemId);
    if (item) return { item, catKey };
  }
  return null;
}

function toggleDone(itemId) {
  const found = findItem(itemId);
  if (!found) return;
  found.item.done = !found.item.done;
  if (found.item.done) {
    if (!state.data.completed.includes(found.item.title)) {
      state.data.completed.push(found.item.title);
    }
  } else {
    state.data.completed = state.data.completed.filter(t => t !== found.item.title);
  }
  saveData();
  render();
}

function moveItem(itemId, targetCatKey) {
  const found = findItem(itemId);
  if (!found || found.catKey === targetCatKey) return;
  state.data.categories[found.catKey].items = state.data.categories[found.catKey].items.filter(i => i.id !== itemId);
  state.data.categories[targetCatKey].items.push(found.item);
  saveData();
  render();
}

function deleteItem(itemId) {
  const found = findItem(itemId);
  if (!found) return;
  if (!confirm(`Delete "${found.item.title}"?`)) return;
  state.data.categories[found.catKey].items = state.data.categories[found.catKey].items.filter(i => i.id !== itemId);
  state.data.completed = state.data.completed.filter(t => t !== found.item.title);
  saveData();
  closeAllModals();
  render();
}

function addItem(title, catKey, type) {
  const id = 'u' + Date.now();
  const newItem = { id, title, type: type || 'normal', done: false };
  state.data.categories[catKey].items.push(newItem);
  saveData();
  render();
}

function getStats() {
  let left = 0;
  for (const cat of Object.values(state.data.categories)) {
    left += cat.items.filter(i => !i.done).length;
  }
  return { left, done: state.data.completed.length };
}

function renderTabs() {
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = TABS.map(t => `<button class="tab ${state.activeTab === t.key ? 'active' : ''}" data-tab="${t.key}">${t.label}</button>`).join('');
  tabsEl.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      state.activeTab = btn.dataset.tab;
      state.showCompletedInCategory = false;
      render();
    });
  });
}

function renderStats() {
  const { left, done } = getStats();
  document.getElementById('stats').textContent = `${left} remaining · ${done} done`;
}

function renderContent() {
  const contentEl = document.getElementById('content');
  if (state.activeTab === 'pairings') {
    contentEl.innerHTML = `
      <p class="pairings-intro">Pick a vibe. Each pairing combines game + manga + anime that feed into each other.</p>
      ${state.data.pairings.map(p => `
        <div class="pairing-card">
          <div class="pairing-name">${p.name}</div>
          <div class="pairing-desc">${p.desc}</div>
          <div class="pairing-tags">${p.items.map(i => `<span class="pairing-tag">${escapeHtml(i)}</span>`).join('')}</div>
        </div>
      `).join('')}
    `;
    return;
  }

  if (state.activeTab === 'done') {
    contentEl.innerHTML = `
      <div class="section-label">✅ COMPLETED (${state.data.completed.length})</div>
      <div class="section-count" style="margin-bottom: 14px;"></div>
      ${state.data.completed.length === 0 ? '<div class="empty-state">Nothing yet. Get watching.</div>' : state.data.completed.map(item => `
        <div style="padding: 7px 0; border-bottom: 1px solid #0e0e16; font-size: 12px; color: #3a3a4a; text-decoration: line-through;">${escapeHtml(item)}</div>
      `).join('')}
      <button class="reset-btn" id="resetBtn">⚠️ Reset to default</button>
    `;
    document.getElementById('resetBtn').addEventListener('click', () => {
      if (confirm('Reset everything back to default? This cannot be undone.')) {
        state.data = JSON.parse(JSON.stringify(INITIAL_DATA));
        saveData();
        render();
      }
    });
    return;
  }

  const cat = state.data.categories[state.activeTab];
  if (!cat) { contentEl.innerHTML = ''; return; }

  const priorityItems = cat.items.filter(i => i.type === 'priority' && !i.done);
  const normalItems = cat.items.filter(i => i.type !== 'priority' && !i.done);
  const doneItems = cat.items.filter(i => i.done);
  const total = cat.items.filter(i => !i.done).length;

  let html = `
    <div class="section-label">${cat.label}</div>
    <div class="section-count">${total} remaining</div>
  `;

  if (total === 0 && doneItems.length === 0) {
    html += '<div class="empty-state">Empty. Tap + to add something.</div>';
  }

  if (priorityItems.length > 0) {
    html += `<div class="priority-block"><div class="priority-label">★ Priority</div>${priorityItems.map(itemHtml).join('')}</div>`;
  }
  html += normalItems.map(itemHtml).join('');

  if (doneItems.length > 0) {
    html += `<button class="toggle-done" id="toggleDoneBtn">${state.showCompletedInCategory ? '▾' : '▸'} ${doneItems.length} completed</button>`;
    if (state.showCompletedInCategory) {
      html += doneItems.map(itemHtml).join('');
    }
  }

  contentEl.innerHTML = html;

  attachItemHandlers();
  const toggleBtn = document.getElementById('toggleDoneBtn');
  if (toggleBtn) {
    toggleBtn.addEventListener('click', () => {
      state.showCompletedInCategory = !state.showCompletedInCategory;
      render();
    });
  }
}

function itemHtml(item) {
  return `
    <div class="item ${item.done ? 'done' : ''}" data-id="${item.id}">
      <div class="checkbox-wrap" data-checkbox="1"><div class="checkbox ${item.done ? 'done' : ''}"></div></div>
      <div class="item-title">${escapeHtml(item.title)}</div>
    </div>
  `;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}

function attachItemHandlers() {
  document.querySelectorAll('.item').forEach(el => {
    let pressTimer = null;
    let longPressed = false;
    let startX = 0, startY = 0;

    const start = (e) => {
      longPressed = false;
      const touch = e.touches ? e.touches[0] : e;
      startX = touch.clientX; startY = touch.clientY;
      el.classList.add('long-pressing');
      pressTimer = setTimeout(() => {
        longPressed = true;
        el.classList.remove('long-pressing');
        if (navigator.vibrate) navigator.vibrate(20);
        openActionModal(el.dataset.id);
      }, 500);
    };

    const cancel = () => {
      el.classList.remove('long-pressing');
      if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
    };

    const handleMove = (e) => {
      const touch = e.touches ? e.touches[0] : e;
      const dx = Math.abs(touch.clientX - startX);
      const dy = Math.abs(touch.clientY - startY);
      // Cancel long-press if user is scrolling
      if (dx > 8 || dy > 8) cancel();
    };

    const tap = (e) => {
      if (longPressed) {
        e.preventDefault();
        e.stopPropagation();
        return;
      }
      // Find what was tapped: checkbox area → toggle done; title area → open action menu
      const target = e.target.closest('[data-checkbox]');
      if (target) {
        toggleDone(el.dataset.id);
      } else {
        // Tapping the title row opens the action menu (where you can also tick done)
        openActionModal(el.dataset.id);
      }
    };

    el.addEventListener('touchstart', start, { passive: true });
    el.addEventListener('touchend', (e) => { cancel(); tap(e); });
    el.addEventListener('touchmove', handleMove, { passive: true });
    el.addEventListener('touchcancel', cancel);
    el.addEventListener('mousedown', start);
    el.addEventListener('mouseup', (e) => { cancel(); tap(e); });
    el.addEventListener('mousemove', handleMove);
    el.addEventListener('mouseleave', cancel);
    el.addEventListener('contextmenu', e => e.preventDefault());
  });
}

function openActionModal(itemId) {
  const found = findItem(itemId);
  if (!found) return;
  state.longPressedItem = itemId;
  document.getElementById('actionItemName').textContent = found.item.title;
  document.getElementById('toggleDoneLabel').textContent = found.item.done ? 'Mark as not done' : 'Mark as done';
  document.getElementById('actionModal').classList.add('active');
}

function closeAllModals() {
  document.querySelectorAll('.modal-backdrop').forEach(m => m.classList.remove('active'));
  state.longPressedItem = null;
}

function setupModals() {
  // Action modal
  document.querySelectorAll('#actionModal .modal-action').forEach(btn => {
    btn.addEventListener('click', () => {
      const action = btn.dataset.action;
      const itemId = state.longPressedItem;
      if (!itemId) return;

      if (action === 'currently') { moveItem(itemId, 'currently'); closeAllModals(); }
      else if (action === 'onhold') { moveItem(itemId, 'onhold'); closeAllModals(); }
      else if (action === 'toggle-done') { toggleDone(itemId); closeAllModals(); }
      else if (action === 'delete') { deleteItem(itemId); }
      else if (action === 'move-other') { openMoveModal(itemId); }
    });
  });
  document.getElementById('actionCancel').addEventListener('click', closeAllModals);
  document.getElementById('actionModal').addEventListener('click', e => {
    if (e.target.id === 'actionModal') closeAllModals();
  });

  // Move modal
  const moveButtons = document.getElementById('moveCategoryButtons');
  moveButtons.innerHTML = Object.entries(CATEGORY_LABELS).map(([key, label]) =>
    `<button class="modal-action" data-target="${key}">${label}</button>`
  ).join('');
  moveButtons.querySelectorAll('.modal-action').forEach(btn => {
    btn.addEventListener('click', () => {
      if (state.longPressedItem) {
        moveItem(state.longPressedItem, btn.dataset.target);
        closeAllModals();
      }
    });
  });
  document.getElementById('moveCancel').addEventListener('click', closeAllModals);
  document.getElementById('moveModal').addEventListener('click', e => {
    if (e.target.id === 'moveModal') closeAllModals();
  });

  // Add modal
  document.getElementById('addBtn').addEventListener('click', () => {
    document.getElementById('addInput').value = '';
    if (state.activeTab !== 'pairings' && state.activeTab !== 'done') {
      document.getElementById('addCategory').value = state.activeTab;
    }
    document.getElementById('addModal').classList.add('active');
    setTimeout(() => document.getElementById('addInput').focus(), 100);
  });
  document.getElementById('addSubmit').addEventListener('click', () => {
    const title = document.getElementById('addInput').value.trim();
    if (!title) return;
    const catKey = document.getElementById('addCategory').value;
    const type = document.getElementById('addType').value;
    addItem(title, catKey, type);
    closeAllModals();
  });
  document.getElementById('addCancel').addEventListener('click', closeAllModals);
  document.getElementById('addModal').addEventListener('click', e => {
    if (e.target.id === 'addModal') closeAllModals();
  });
  document.getElementById('addInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('addSubmit').click();
  });
}

function openMoveModal(itemId) {
  document.getElementById('actionModal').classList.remove('active');
  state.longPressedItem = itemId;
  document.getElementById('moveModal').classList.add('active');
}

function render() {
  renderTabs();
  renderStats();
  renderContent();
}

// Init
loadData();
setupModals();
render();

// Register a minimal service worker for offline (optional, will fail silently if not supported)
if ('serviceWorker' in navigator) {
  const swCode = `
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => self.clients.claim());
    self.addEventListener('fetch', e => {
      e.respondWith(
        caches.open('backlog-v1').then(cache =>
          cache.match(e.request).then(resp => resp || fetch(e.request).then(networkResp => {
            if (e.request.method === 'GET' && networkResp.ok) cache.put(e.request, networkResp.clone());
            return networkResp;
          }).catch(() => cache.match('/')))
        )
      );
    });
  `;
  const blob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl).catch(() => {});
}
</script>
